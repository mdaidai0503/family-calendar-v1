<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>家族カレンダー</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--danger:#dc2626;--sun:#dc2626;--sat:#2563eb;
  --row-h:122px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1000px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:82px}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0}
.month-nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#fecaca}
.month-label{font-weight:800;min-width:110px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);background:#fafafa;border-bottom:1px solid var(--line)}
.week div{text-align:center;padding:7px 0;font-size:12px;color:var(--muted)}
.week div:first-child{color:var(--sun)} .week div:last-child{color:var(--sat)}
.calendar-wrap{position:relative}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,var(--row-h));position:relative;z-index:1}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;background:#fff;cursor:pointer;overflow:hidden;position:relative}
.day:nth-child(7n){border-right:none}
.day.other{background:#fafafa;color:#aaa}
.day.sun .num{color:var(--sun)} .day.sat .num{color:var(--sat)}
.day.today .num{background:var(--accent);color:#fff;border-radius:999px;width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center}
.num{font-size:13px;font-weight:800;margin-bottom:4px}
.overlay{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,var(--row-h));pointer-events:none;z-index:5}
.band{
  height:24px;align-self:start;margin-top:34px;
  border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:auto;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;
}
.band.lane1{margin-top:62px}.band.lane2{margin-top:90px}
.band.start{border-top-left-radius:9px;border-bottom-left-radius:9px}
.band.end{border-top-right-radius:9px;border-bottom-right-radius:9px}
.band.mid{border-radius:2px}
.band.single{border-radius:9px}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.legend span{font-size:12px;display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%}
.floating{position:fixed;right:18px;bottom:92px;width:58px;height:58px;border:none;border-radius:50%;font-size:30px;background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,.2);cursor:pointer;z-index:40}
.filter-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,1000px);height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:45;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.filter-btn{min-width:0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 3px;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:#374151}
.filter-btn.active{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;box-shadow:inset 0 0 0 1px #2563eb}
.filter-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
dialog{border:none;border-radius:15px;padding:0;width:min(94vw,560px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.modal{padding:18px}.modal h2{margin:0 0 14px;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
label{font-size:12px;color:var(--muted);font-weight:700}
input,select,textarea{width:100%;font:inherit;border:1px solid #cfd3d8;border-radius:9px;padding:10px;background:#fff}
textarea{min-height:78px;resize:vertical}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer}
.chip.active{background:#eff6ff;border-color:#93c5fd;font-weight:700}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.toggle-row input{width:auto}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.setup-banner{margin:12px;padding:12px;border:1px solid #f1d58a;background:#fff8e1;border-radius:10px;font-size:13px}
.summary{font-size:12px;color:var(--muted);background:#f8fafc;border-radius:8px;padding:8px 10px;margin-bottom:12px}
.hidden{display:none!important}
@media(max-width:700px){
  :root{--row-h:96px}
  .topbar{flex-direction:column;align-items:flex-start}
  .month-nav{width:100%;justify-content:space-between}
  .day{padding:4px}
  .band{height:20px;font-size:9px;padding:3px 4px;margin-top:30px}
  .band.lane1{margin-top:53px}.band.lane2{margin-top:76px}
  .grid{grid-template-columns:1fr}
  .chips{grid-template-columns:repeat(2,1fr)}
  .floating{right:14px;bottom:88px}
  .filter-nav{height:68px;padding-left:5px;padding-right:5px;gap:3px}
  .filter-btn{font-size:10px;padding:7px 2px}
}

.import-btn{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;font-weight:700}.import-preview{width:100%;max-height:260px;object-fit:contain;background:#f8fafc;border:1px solid var(--line);border-radius:10px;margin:8px 0 12px}.import-status{font-size:13px;padding:9px 10px;border-radius:8px;background:#f8fafc;color:#475569;margin:8px 0}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;width:0;background:#2563eb;transition:width .2s}.ocr-raw{min-height:120px;font-size:12px}.review-list{display:grid;gap:10px;margin-top:12px;max-height:52vh;overflow:auto;padding-right:2px}.review-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.review-head{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}.review-head strong{font-size:14px}.match-ok{color:#15803d;font-size:12px}.match-ng{color:#b45309;font-size:12px}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.review-card textarea{min-height:58px;font-size:12px}.review-card input{font-size:12px;padding:8px}.import-note{font-size:12px;line-height:1.55;color:#64748b;background:#f8fafc;padding:10px;border-radius:9px}@media(max-width:700px){.review-grid{grid-template-columns:1fr}.import-btn{padding:8px 7px;font-size:12px}}

.source-btn{background:#f0fdf4;border-color:#bbf7d0;color:#166534;font-weight:700}
.source-list{display:grid;gap:10px;max-height:52vh;overflow:auto;margin-top:12px}
.source-card{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}
.source-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.source-meta{font-size:12px;color:var(--muted);margin-top:4px}
.source-preview{width:100%;max-height:60vh;object-fit:contain;background:#111;border-radius:10px;margin-top:10px}
.source-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
@media(max-width:700px){.source-btn{font-size:11px;padding:8px 6px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="topbar">
    <h1>家族カレンダー</h1>
    <div class="month-nav">
      <button class="btn" id="prevBtn">‹</button>
      <button class="btn" id="todayBtn">今日</button>
      <div class="month-label" id="monthLabel"></div>
      <button class="btn" id="nextBtn">›</button>
      <button class="btn source-btn" id="monthlySourceBtn">📅月間元予定</button>
      <button class="btn source-btn" id="weeklySourceBtn">📄週間元予定</button>
      <button class="btn import-btn" id="importBtn">📷予定表取込</button>
      <button class="btn" id="settingsBtn">設定</button>
    </div>
  </div>
</header>

<div id="setupBanner" class="setup-banner">初回だけ「設定」からSupabase URLとanon keyを入力してください。</div>

<div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div class="calendar-wrap">
  <main id="calendar" class="calendar"></main>
  <div id="overlay" class="overlay"></div>
</div>
<div id="legend" class="legend"></div>
</div>

<button class="floating" id="addBtn">＋</button>
<nav class="filter-nav" id="filterNav" aria-label="家族予定表示切替"></nav>

<dialog id="eventDialog">
<form method="dialog" class="modal" id="eventForm">
  <h2 id="eventTitle">予定を登録</h2>
  <input type="hidden" id="eventId">

  <div class="grid">
    <div class="field"><label>開始日</label><input type="date" id="startDate" required></div>
    <div class="field"><label>終了日</label><input type="date" id="endDate" required></div>
  </div>
  <div class="summary" id="rangeSummary"></div>

  <div class="field"><label>誰の予定</label><select id="member" required></select></div>

  <div class="toggle-row">
    <label for="allDay">終日予定</label>
    <input type="checkbox" id="allDay">
  </div>

  <div class="grid" id="timeFields">
    <div class="field"><label>開始時間</label><input type="time" id="startTime"></div>
    <div class="field"><label>終了時間</label><input type="time" id="endTime"></div>
  </div>

  <div class="field">
    <label>予定種類</label>
    <div class="chips" id="categoryChips"></div>
    <input type="hidden" id="category" value="仕事">
  </div>

  <div class="field"><label>予定名</label><input type="text" id="title" maxlength="80" placeholder="例：家族旅行" required></div>
  <div class="field"><label>メモ</label><textarea id="memo" maxlength="500"></textarea></div>

  <div class="actions">
    <button type="button" class="btn danger hidden" id="deleteBtn">削除</button>
    <button type="button" class="btn" id="cancelBtn">キャンセル</button>
    <button type="submit" class="btn primary">保存</button>
  </div>
</form>
</dialog>

<dialog id="importDialog"><div class="modal"><h2>📷 サンダーバーズ予定表取込</h2><div class="import-note">昌輝（家族4）の既存「サンダーバーズユース」予定に、週予定表から時間・場所・持ち物・備考を追加します。反映前に必ず内容を確認できます。</div><div class="field" style="margin-top:12px"><label>予定表の写真</label><input id="importFile" type="file" accept="image/*" capture="environment"></div><img id="importPreview" class="import-preview hidden" alt="予定表プレビュー"><div id="importStatus" class="import-status">写真を選択してください。</div><div class="progress"><i id="importProgress"></i></div><div class="actions"><button class="btn" type="button" id="importClose">閉じる</button><button class="btn primary" type="button" id="ocrBtn">写真を解析</button></div><div id="ocrArea" class="hidden" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><div class="field"><label>OCR結果（必要なら修正できます）</label><textarea id="ocrText" class="ocr-raw"></textarea></div><div class="actions"><button class="btn primary" type="button" id="parseBtn">予定を照合</button></div></div><div id="reviewArea" class="hidden" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><strong>反映内容の確認</strong><div id="reviewList" class="review-list"></div><div class="actions"><button class="btn primary" type="button" id="applyImportBtn">チェックした予定を反映</button></div></div></div></dialog>

<dialog id="sourceDialog">
<div class="modal">
  <h2 id="sourceDialogTitle">元予定表</h2>
  <div id="sourceDialogNote" class="import-note"></div>
  <div id="monthlyUploadArea" class="hidden" style="margin-top:12px">
    <div class="field"><label>表示中の月の月間予定表写真を登録</label><input id="monthlySourceFile" type="file" accept="image/*" capture="environment"></div>
    <div class="actions"><button class="btn primary" type="button" id="monthlySourceUploadBtn">月間予定表を保存</button></div>
  </div>
  <div id="sourceStatus" class="import-status">読み込み中…</div>
  <div id="sourceList" class="source-list"></div>
  <div class="actions"><button class="btn" type="button" id="sourceCloseBtn">閉じる</button></div>
</div>
</dialog>
<dialog id="settingsDialog">
<div class="modal">
  <h2>設定</h2>
  <div class="field"><label>Supabase URL</label><input id="supabaseUrl"></div>
  <div class="field"><label>Supabase anon key</label><textarea id="supabaseKey"></textarea></div>
  <div class="field"><label>家族1</label><input id="name0"></div>
  <div class="field"><label>家族2</label><input id="name1"></div>
  <div class="field"><label>家族3</label><input id="name2"></div>
  <div class="field"><label>家族4</label><input id="name3"></div>
  <div class="field"><label>この端末の初期選択</label><select id="defaultMember"></select></div>
  <div class="actions">
    <button class="btn" id="settingsCancel">閉じる</button>
    <button class="btn primary" id="settingsSave">保存して接続</button>
  </div>
</div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const COLORS=["#93c5fd","#f9a8d4","#86efac","#fdba74"];
const TEXTCOLORS=["#1e3a8a","#9d174d","#166534","#9a3412"];
const DEFAULT_NAMES=["父","母","子1","子2"];
const CATEGORIES=["仕事","学校","習い事","病院","外出","その他"];
let members=JSON.parse(localStorage.getItem("family_names")||"null")||DEFAULT_NAMES;
let current=new Date(); current.setDate(1);
let events=[],sb=null,channel=null,visibleStart=null;
let activeFilter=localStorage.getItem("calendar_filter")||"all";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}

function rebuild(){
  $("member").innerHTML=members.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join("");
  $("defaultMember").innerHTML=members.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join("");
  $("legend").innerHTML=members.map((n,i)=>`<span><i class="dot" style="background:${COLORS[i]}"></i>${esc(n)}</span>`).join("");
  $("categoryChips").innerHTML=CATEGORIES.map(c=>`<button type="button" class="chip" data-cat="${c}">${c}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>selectCategory(b.dataset.cat));
  rebuildFilterNav();
}
function rebuildFilterNav(){
  const nav=$("filterNav");
  if(!nav) return;
  const memberButtons=members.map((n,i)=>`<button type="button" class="filter-btn" data-filter="${i}"><span class="filter-dot" style="background:${COLORS[i]}"></span>${esc(n)}</button>`).join("");
  nav.innerHTML=memberButtons+`<button type="button" class="filter-btn" data-filter="all">全員</button>`;
  nav.querySelectorAll(".filter-btn").forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));
  updateFilterButtons();
}
function setFilter(value){
  activeFilter=["0","1","2","3","all"].includes(value)?value:"all";
  localStorage.setItem("calendar_filter",activeFilter);
  updateFilterButtons();
  render();
}
function updateFilterButtons(){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b.dataset.filter===activeFilter));
}
function getVisibleEvents(){
  if(activeFilter==="all") return events;
  return events.filter(e=>String(e.member_index)===activeFilter);
}
function selectCategory(cat){
  $("category").value=cat;
  document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));
}
function loadSettingsUI(){
  $("supabaseUrl").value=localStorage.getItem("supabase_url")||"";
  $("supabaseKey").value=localStorage.getItem("supabase_key")||"";
  members.forEach((n,i)=>$("name"+i).value=n);
  rebuild();
  $("defaultMember").value=localStorage.getItem("default_member")||"0";
  $("setupBanner").classList.toggle("hidden",!!($("supabaseUrl").value&&$("supabaseKey").value));
}
async function connect(){
  const url=localStorage.getItem("supabase_url"),key=localStorage.getItem("supabase_key");
  if(!url||!key||!window.supabase){render();return}
  try{
    if(channel&&sb) await sb.removeChannel(channel);
    sb=window.supabase.createClient(url,key);
    await loadEvents();
    channel=sb.channel("family-events-v2-band")
      .on("postgres_changes",{event:"*",schema:"public",table:"family_events"},()=>loadEvents())
      .subscribe();
  }catch(e){console.error(e);alert("Supabaseへの接続に失敗しました。")}
}
async function loadEvents(){
  if(!sb){render();return}
  const first=new Date(current.getFullYear(),current.getMonth(),1);
  visibleStart=new Date(first); visibleStart.setDate(first.getDate()-first.getDay());
  const visibleEnd=new Date(visibleStart); visibleEnd.setDate(visibleStart.getDate()+41);
  const {data,error}=await sb.from("family_events")
    .select("*")
    .lte("event_date",ymd(visibleEnd))
    .gte("end_date",ymd(visibleStart))
    .order("event_date").order("start_time",{ascending:true});
  if(error){
    console.error(error);
    alert("予定の読込に失敗しました。v2-migration.sqlを実行したか確認してください。");
    return;
  }
  events=data||[];
  render();
}

function dayIndex(s){ return Math.round((parseDate(s)-visibleStart)/86400000); }

function assignLanes(sourceEvents){
  const occupied=Array.from({length:6},()=>[[],[],[]]);
  const map=new Map();
  const sorted=[...sourceEvents].sort((a,b)=>
    (a.event_date.localeCompare(b.event_date)) ||
    ((b.end_date||b.event_date).localeCompare(a.end_date||a.event_date))
  );
  for(const e of sorted){
    let lane=0;
    for(;lane<3;lane++){
      let ok=true;
      const s=Math.max(0,dayIndex(e.event_date));
      const ee=Math.min(41,dayIndex(e.end_date||e.event_date));
      for(let i=s;i<=ee;i++){
        const r=Math.floor(i/7);
        if(occupied[r][lane].includes(i)){ok=false;break}
      }
      if(ok) break;
    }
    if(lane>2) lane=2;
    map.set(e.id,lane);
    const s=Math.max(0,dayIndex(e.event_date)),ee=Math.min(41,dayIndex(e.end_date||e.event_date));
    for(let i=s;i<=ee;i++){
      const r=Math.floor(i/7);
      occupied[r][lane].push(i);
    }
  }
  return map;
}

function renderBands(){
  const overlay=$("overlay"); overlay.innerHTML="";
  const visibleEvents=getVisibleEvents();
  const laneMap=assignLanes(visibleEvents);
  for(const e of visibleEvents){
    const actualStart=parseDate(e.event_date);
    const actualEnd=parseDate(e.end_date||e.event_date);
    const visEnd=new Date(visibleStart);visEnd.setDate(visibleStart.getDate()+41);
    const s=actualStart<visibleStart?new Date(visibleStart):actualStart;
    const en=actualEnd>visEnd?visEnd:actualEnd;
    if(en<s) continue;

    const sIdx=Math.round((s-visibleStart)/86400000);
    const eIdx=Math.round((en-visibleStart)/86400000);
    const lane=laneMap.get(e.id)||0;
    let cursor=sIdx;

    while(cursor<=eIdx){
      const row=Math.floor(cursor/7);
      const rowEnd=row*7+6;
      const segEnd=Math.min(eIdx,rowEnd);
      const colStart=(cursor%7)+1;
      const colEnd=(segEnd%7)+2;

      const band=document.createElement("div");
      const idx=Math.max(0,Math.min(3,Number(e.member_index)||0));
      const segmentStartsActual = cursor===dayIndex(e.event_date);
      const segmentEndsActual = segEnd===dayIndex(e.end_date||e.event_date);
      let shape="mid";
      if(segmentStartsActual && segmentEndsActual) shape="single";
      else if(segmentStartsActual) shape="start";
      else if(segmentEndsActual) shape="end";

      band.className=`band lane${lane} ${shape}`;
      band.style.gridColumn=`${colStart} / ${colEnd}`;
      band.style.gridRow=`${row+1}`;
      band.style.background=COLORS[idx];
      band.style.color=TEXTCOLORS[idx];
      band.textContent=`${e.title}（${members[idx]||"?"}）`;
      band.title=`${e.event_date} ～ ${e.end_date||e.event_date}　${e.title}`;
      band.onclick=()=>openEdit(e);
      overlay.appendChild(band);

      cursor=segEnd+1;
    }
  }
}

function render(){
  $("monthLabel").textContent=`${current.getFullYear()}年${current.getMonth()+1}月`;
  const cal=$("calendar"); cal.innerHTML="";
  const first=new Date(current.getFullYear(),current.getMonth(),1);
  visibleStart=new Date(first); visibleStart.setDate(first.getDate()-first.getDay());
  const today=ymd(new Date());

  for(let i=0;i<42;i++){
    const d=new Date(visibleStart); d.setDate(visibleStart.getDate()+i);
    const key=ymd(d),dow=d.getDay();
    const div=document.createElement("div");
    div.className="day";
    if(d.getMonth()!==current.getMonth()) div.classList.add("other");
    if(key===today) div.classList.add("today");
    if(dow===0) div.classList.add("sun"); if(dow===6) div.classList.add("sat");
    div.innerHTML=`<div class="num">${d.getDate()}</div>`;
    div.onclick=()=>openNew(key);
    cal.appendChild(div);
  }
  renderBands();
}
function updateRangeSummary(){

const SOURCE_BUCKET='family-schedule-sources';
let currentSourceType='monthly';
function monthRange(){const y=current.getFullYear(),m=current.getMonth();const a=new Date(y,m,1),b=new Date(y,m+1,0);return{start:ymd(a),end:ymd(b)}}
function extOf(file){const n=(file&&file.name)||'';const m=n.match(/\\.([a-zA-Z0-9]+)$/);return m?m[1].toLowerCase():(file&&file.type==='image/png'?'png':'jpg')}
async function uploadSourceFile(file,type,periodStart,periodEnd){
  if(!sb)throw new Error('Supabaseに接続されていません。');
  const ext=extOf(file),safeType=type==='monthly'?'monthly':'weekly';
  const path=`maki/${safeType}/${periodStart}_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error:upErr}=await sb.storage.from(SOURCE_BUCKET).upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
  if(upErr)throw upErr;
  const {error:dbErr}=await sb.from('schedule_sources').insert({source_type:safeType,member_index:MAKI_INDEX,period_start:periodStart,period_end:periodEnd,file_path:path,file_name:file.name||`${safeType}.${ext}`});
  if(dbErr){await sb.storage.from(SOURCE_BUCKET).remove([path]);throw dbErr}
  return path;
}
async function openSourceImage(path){
  const {data,error}=await sb.storage.from(SOURCE_BUCKET).createSignedUrl(path,300);
  if(error)throw error;
  window.open(data.signedUrl,'_blank','noopener');
}
async function loadSourceList(type){
  currentSourceType=type;
  const range=monthRange();
  $('sourceDialogTitle').textContent=type==='monthly'?'📅 月間元予定':'📄 週間元予定';
  $('sourceDialogNote').textContent=type==='monthly'?'表示中の月の月間予定表写真を保存・参照できます。':'表示中の月に関係する週間予定表の原本写真です。予定表取込時に自動保存されます。';
  $('monthlyUploadArea').classList.toggle('hidden',type!=='monthly');
  $('sourceStatus').textContent='元予定表を読み込んでいます…'; $('sourceList').innerHTML='';
  let q=sb.from('schedule_sources').select('*').eq('member_index',MAKI_INDEX).eq('source_type',type).lte('period_start',range.end).gte('period_end',range.start).order('created_at',{ascending:false});
  const {data,error}=await q;if(error)throw error;
  const rows=data||[];$('sourceStatus').textContent=rows.length?`${rows.length}件あります。`:'この月の元予定表はまだありません。';
  for(const r of rows){const c=document.createElement('div');c.className='source-card';const label=r.source_type==='monthly'?'月間予定表':'週間予定表';c.innerHTML=`<div class="source-card-head"><strong>${esc(label)}</strong><button class="btn primary source-open" type="button">開く</button></div><div class="source-meta">${esc(r.period_start)} ～ ${esc(r.period_end)}<br>${esc(r.file_name||'')}</div>`;c.querySelector('.source-open').onclick=async()=>{try{await openSourceImage(r.file_path)}catch(e){alert('元画像を開けません: '+(e.message||e))}};$('sourceList').appendChild(c)}
}
async function showSourceDialog(type){
  if(!sb){alert('先にSupabaseへ接続してください。');return}
  $('sourceDialog').showModal();
  try{await loadSourceList(type)}catch(e){console.error(e);$('sourceStatus').textContent='読み込みに失敗しました。v2.3-source-migration.sqlを実行してください。'}
}
$('monthlySourceBtn').onclick=()=>showSourceDialog('monthly');
$('weeklySourceBtn').onclick=()=>showSourceDialog('weekly');
$('sourceCloseBtn').onclick=()=>$('sourceDialog').close();
$('monthlySourceUploadBtn').onclick=async()=>{const f=$('monthlySourceFile').files&&$('monthlySourceFile').files[0];if(!f){alert('月間予定表の写真を選択してください。');return}const r=monthRange();$('monthlySourceUploadBtn').disabled=true;$('sourceStatus').textContent='月間予定表を保存しています…';try{await uploadSourceFile(f,'monthly',r.start,r.end);$('monthlySourceFile').value='';await loadSourceList('monthly');alert('月間予定表の元画像を保存しました。')}catch(e){console.error(e);alert('保存に失敗しました: '+(e.message||e))}finally{$('monthlySourceUploadBtn').disabled=false}};

let importImageFile=null,parsedImportBlocks=[]; const MAKI_INDEX=3;
function normalizeOCRText(s){const fw='０１２３４５６７８９';s=String(s||'').replace(/[０-９]/g,c=>String(fw.indexOf(c)));return s.replace(/：/g,':').replace(/＠/g,'@').replace(/～/g,'〜').replace(/[\u00A0\t]+/g,' ').replace(/ +/g,' ')}
function isoDate(y,m,d){return `${y}-${pad(m)}-${pad(d)}`}
function extractSections(text){const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);let belongings=[],notes=[],mode='schedule';for(const line of lines){if(/^持ち物/.test(line)){mode='belongings';const r=line.replace(/^持ち物[:：]?\s*/,'');if(r)belongings.push(r);continue}if(/^備考/.test(line)){mode='notes';const r=line.replace(/^備考[:：]?\s*/,'');if(r)notes.push(r);continue}if(mode==='belongings')belongings.push(line);else if(mode==='notes')notes.push(line.replace(/^[・•●]\s*/,''))}return{belongings:belongings.join('、').replace(/、+/g,'、'),notes:notes.join('\n')}}
function parseThunderbirdsOCR(raw){const text=normalizeOCRText(raw),dateRe=/(\d{1,2})月\s*(\d{1,2})日[^\n]*?(?:[〜~～\-]\s*(\d{1,2})日)?[^\n]*/g;let hits=[],m;while((m=dateRe.exec(text))!==null)hits.push({index:m.index,header:m[0],month:+m[1],day:+m[2],endDay:m[3]?+m[3]:+m[2]});const year=current.getFullYear(),blocks=[];for(let i=0;i<hits.length;i++){const h=hits[i],body=text.slice(h.index+h.header.length,i+1<hits.length?hits[i+1].index:text.length).trim(),header=h.header;let location='';const at=header.match(/@\s*([^\n]+)/);if(at)location=at[1].replace(/[|｜].*$/,'').trim();if(!location){const lm=(header+'\n'+body).match(/(?:@\s*)?([^\n、,]*?(?:中学校|中学|球場|グラウンド|体育館))/);if(lm)location=lm[1].trim()}const tl=[],tre=/(\d{1,2})\s*[:.]\s*(\d{2})\s*([^\n]*)/g;let tm;while((tm=tre.exec(body))!==null){const hh=String(Math.min(23,+tm[1])).padStart(2,'0'),mm=String(Math.min(59,+tm[2])).padStart(2,'0');tl.push({time:`${hh}:${mm}`,text:(tm[3]||'').trim()})}const sec=extractSections(body);blocks.push({start:isoDate(year,h.month,h.day),end:isoDate(year,h.month,h.endDay),location,startTime:tl.length?tl[0].time:'',endTime:tl.length?tl[tl.length-1].time:'',schedule:tl.map(x=>`${x.time} ${x.text}`.trim()).join('\n'),belongings:sec.belongings,notes:sec.notes,matches:[],enabled:true})}return blocks}
async function matchImportBlocks(blocks){if(!sb)throw new Error('Supabaseに接続されていません。');for(const b of blocks){const {data,error}=await sb.from('family_events').select('*').eq('member_index',MAKI_INDEX).gte('event_date',b.start).lte('event_date',b.end).order('event_date');if(error)throw error;b.matches=(data||[]).filter(e=>String(e.memo||'').includes('サンダーバーズユース'))}return blocks}
function renderImportReview(){const list=$('reviewList');list.innerHTML='';parsedImportBlocks.forEach((b,i)=>{const card=document.createElement('div');card.className='review-card';const mt=b.matches.length?`${b.matches.length}件一致：${b.matches.map(x=>`${x.event_date} ${x.title}`).join(' / ')}`:'一致する既存予定なし';card.innerHTML=`<div class="review-head"><strong>${esc(b.start)}${b.end!==b.start?' ～ '+esc(b.end):''}</strong><label style="display:flex;gap:5px;align-items:center"><input style="width:auto" type="checkbox" class="imp-enabled" data-i="${i}" ${b.matches.length?'checked':''}>反映</label></div><div class="${b.matches.length?'match-ok':'match-ng'}">${esc(mt)}</div><div class="review-grid" style="margin-top:8px"><div class="field"><label>開始時間</label><input class="imp-start" data-i="${i}" type="time" value="${esc(b.startTime)}"></div><div class="field"><label>終了時間</label><input class="imp-end" data-i="${i}" type="time" value="${esc(b.endTime)}"></div></div><div class="field"><label>場所</label><input class="imp-location" data-i="${i}" value="${esc(b.location)}"></div><div class="field"><label>当日の予定</label><textarea class="imp-schedule" data-i="${i}">${esc(b.schedule)}</textarea></div><div class="field"><label>持ち物</label><textarea class="imp-belongings" data-i="${i}">${esc(b.belongings)}</textarea></div><div class="field"><label>備考</label><textarea class="imp-notes" data-i="${i}">${esc(b.notes)}</textarea></div>`;list.appendChild(card)})}
function collectReviewEdits(){document.querySelectorAll('.imp-enabled').forEach(el=>parsedImportBlocks[+el.dataset.i].enabled=el.checked);document.querySelectorAll('.imp-start').forEach(el=>parsedImportBlocks[+el.dataset.i].startTime=el.value);document.querySelectorAll('.imp-end').forEach(el=>parsedImportBlocks[+el.dataset.i].endTime=el.value);document.querySelectorAll('.imp-location').forEach(el=>parsedImportBlocks[+el.dataset.i].location=el.value.trim());document.querySelectorAll('.imp-schedule').forEach(el=>parsedImportBlocks[+el.dataset.i].schedule=el.value.trim());document.querySelectorAll('.imp-belongings').forEach(el=>parsedImportBlocks[+el.dataset.i].belongings=el.value.trim());document.querySelectorAll('.imp-notes').forEach(el=>parsedImportBlocks[+el.dataset.i].notes=el.value.trim())}
function buildImportedMemo(existing,b){let base=String(existing||'').split('【週予定詳細】')[0].trim(),parts=[];if(b.location)parts.push(`場所：${b.location}`);if(b.schedule)parts.push(`【当日の予定】\n${b.schedule}`);if(b.belongings)parts.push(`【持ち物】\n${b.belongings}`);if(b.notes)parts.push(`【備考】\n${b.notes}`);return `${base}${base?'\n\n':''}【週予定詳細】\n${parts.join('\n\n')}`.trim()}
async function applyImport(){collectReviewEdits();const targets=parsedImportBlocks.filter(b=>b.enabled&&b.matches.length);if(!targets.length){alert('反映できる予定がありません。');return}$('applyImportBtn').disabled=true;$('importStatus').textContent='予定へ反映しています…';try{let count=0;for(const b of targets){for(const e of b.matches){const payload={memo:buildImportedMemo(e.memo,b)};if(b.startTime||b.endTime){payload.all_day=false;payload.start_time=b.startTime||null;payload.end_time=b.endTime||null}const {error}=await sb.from('family_events').update(payload).eq('id',e.id);if(error)throw error;count++}}if(importImageFile&&targets.length){const ps=targets.map(x=>x.start).sort()[0],pe=targets.map(x=>x.end).sort().slice(-1)[0];await uploadSourceFile(importImageFile,'weekly',ps,pe)}$('importStatus').textContent=`${count}件の昌輝の予定へ反映し、週間予定表の元画像も保存しました。`;await loadEvents();alert(`${count}件の予定に時間・場所・持ち物・備考を反映し、元画像も保存しました。`)}catch(err){console.error(err);alert('反映に失敗しました: '+(err.message||err))}finally{$('applyImportBtn').disabled=false}}
$('importBtn').onclick=()=>{$('importFile').value='';$('importPreview').classList.add('hidden');$('ocrArea').classList.add('hidden');$('reviewArea').classList.add('hidden');$('importStatus').textContent='写真を選択してください。';$('importProgress').style.width='0%';importImageFile=null;parsedImportBlocks=[];$('importDialog').showModal()};$('importClose').onclick=()=>$('importDialog').close();$('importFile').onchange=e=>{importImageFile=e.target.files&&e.target.files[0];if(!importImageFile)return;const url=URL.createObjectURL(importImageFile);$('importPreview').src=url;$('importPreview').classList.remove('hidden');$('importStatus').textContent='写真を選択しました。「写真を解析」を押してください。'};$('ocrBtn').onclick=async()=>{if(!importImageFile){alert('予定表の写真を選択してください。');return}if(!window.Tesseract){alert('OCRライブラリを読み込めませんでした。インターネット接続を確認してください。');return}$('ocrBtn').disabled=true;$('importStatus').textContent='日本語OCRを実行しています。初回は少し時間がかかります…';try{const result=await Tesseract.recognize(importImageFile,'jpn',{logger:m=>{if(typeof m.progress==='number')$('importProgress').style.width=Math.round(m.progress*100)+'%';if(m.status)$('importStatus').textContent=`解析中：${m.status}`}});$('ocrText').value=normalizeOCRText(result.data.text||'');$('ocrArea').classList.remove('hidden');$('importStatus').textContent='OCRが完了しました。文字を確認して「予定を照合」を押してください。'}catch(err){console.error(err);alert('画像解析に失敗しました。写真を撮り直すか、OCR結果を手入力してください。');$('ocrArea').classList.remove('hidden')}finally{$('ocrBtn').disabled=false}};$('parseBtn').onclick=async()=>{try{parsedImportBlocks=parseThunderbirdsOCR($('ocrText').value);if(!parsedImportBlocks.length){alert('日付を読み取れませんでした。OCR結果の日付表記を確認してください。');return}$('importStatus').textContent=`${parsedImportBlocks.length}個の日付ブロックを検出。既存予定と照合しています…`;await matchImportBlocks(parsedImportBlocks);renderImportReview();$('reviewArea').classList.remove('hidden');const matched=parsedImportBlocks.reduce((n,b)=>n+b.matches.length,0);$('importStatus').textContent=`照合完了：既存の昌輝の予定 ${matched}件が候補です。内容を確認して反映してください。`}catch(err){console.error(err);alert('予定照合に失敗しました: '+(err.message||err))}};$('applyImportBtn').onclick=applyImport;

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
}
loadSettingsUI();selectCategory("仕事");render();connect();
