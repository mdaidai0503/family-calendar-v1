<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>家族カレンダー</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --bg:#f6f7f9; --card:#fff; --text:#202124; --muted:#70757a;
      --line:#e5e7eb; --accent:#2f6fed; --danger:#d93025;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:980px;margin:0 auto;min-height:100vh;background:#fff}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .topbar h1{font-size:20px;margin:0;white-space:nowrap}
    .month-nav{display:flex;gap:6px;align-items:center}
    button{font:inherit}
    .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.danger{background:#fff;color:var(--danger);border-color:#f1c1bd}
    .month-label{font-weight:700;min-width:110px;text-align:center}
    .week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:#fafafa}
    .week div{text-align:center;padding:7px 0;font-size:12px;color:var(--muted)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr)}
    .day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;background:#fff;overflow:hidden}
    .day:nth-child(7n){border-right:none}
    .day.other{background:#fafafa;color:#aaa}
    .day.today .num{background:var(--accent);color:#fff;border-radius:999px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
    .num{font-size:13px;font-weight:700;margin-bottom:4px}
    .event{font-size:11px;line-height:1.25;border-radius:5px;padding:3px 5px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:4px solid currentColor;background:#f7f7f7}
    .legend{display:flex;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
    .legend span{font-size:12px;display:inline-flex;align-items:center;gap:5px}
    .dot{width:10px;height:10px;border-radius:50%}
    .floating{position:fixed;right:18px;bottom:24px;width:56px;height:56px;border:none;border-radius:50%;font-size:30px;line-height:1;background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,.2);cursor:pointer}
    dialog{border:none;border-radius:14px;padding:0;width:min(92vw,520px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
    dialog::backdrop{background:rgba(0,0,0,.35)}
    .modal{padding:18px}
    .modal h2{margin:0 0 14px;font-size:19px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
    label{font-size:12px;color:var(--muted);font-weight:600}
    input,select,textarea{width:100%;font:inherit;border:1px solid #cfd3d8;border-radius:9px;padding:10px;background:#fff}
    textarea{min-height:80px;resize:vertical}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    .settings{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line)}
    .setup-banner{margin:12px;padding:12px;border:1px solid #f1d58a;background:#fff8e1;border-radius:10px;font-size:13px}
    .hidden{display:none!important}
    @media(max-width:700px){
      .app{max-width:none}
      .topbar{align-items:flex-start;flex-direction:column}
      .month-nav{width:100%;justify-content:space-between}
      .day{min-height:86px;padding:4px}
      .event{font-size:9px;padding:2px 3px}
      .grid{grid-template-columns:1fr}
      .floating{bottom:18px;right:14px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <h1>家族カレンダー</h1>
      <div class="month-nav">
        <button class="btn" id="prevBtn">‹</button>
        <button class="btn" id="todayBtn">今日</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="btn" id="nextBtn">›</button>
        <button class="btn" id="settingsBtn">設定</button>
      </div>
    </div>
  </header>

  <div id="setupBanner" class="setup-banner">
    初回だけ「設定」から Supabase URL と anon key を入力してください。
  </div>

  <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
  <main id="calendar" class="calendar"></main>
  <div id="legend" class="legend"></div>
</div>

<button class="floating" id="addBtn" aria-label="予定を追加">＋</button>

<dialog id="eventDialog">
  <form method="dialog" class="modal" id="eventForm">
    <h2 id="eventTitle">予定を登録</h2>
    <input type="hidden" id="eventId">
    <div class="grid">
      <div class="field">
        <label>日付</label>
        <input type="date" id="eventDate" required>
      </div>
      <div class="field">
        <label>誰の予定</label>
        <select id="member" required></select>
      </div>
    </div>
    <div class="grid">
      <div class="field">
        <label>開始時間</label>
        <input type="time" id="startTime">
      </div>
      <div class="field">
        <label>終了時間</label>
        <input type="time" id="endTime">
      </div>
    </div>
    <div class="field">
      <label>予定種類</label>
      <select id="category">
        <option>仕事</option><option>学校</option><option>習い事</option>
        <option>病院</option><option>外出</option><option>その他</option>
      </select>
    </div>
    <div class="field">
      <label>予定名</label>
      <input type="text" id="title" maxlength="80" placeholder="例：東京出張" required>
    </div>
    <div class="field">
      <label>メモ</label>
      <textarea id="memo" maxlength="500" placeholder="必要な場合だけ入力"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn danger hidden" id="deleteBtn">削除</button>
      <button type="button" class="btn" id="cancelBtn">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <div class="modal">
    <h2>設定</h2>
    <div class="field"><label>Supabase URL</label><input id="supabaseUrl" placeholder="https://xxxxx.supabase.co"></div>
    <div class="field"><label>Supabase anon key</label><textarea id="supabaseKey" placeholder="eyJ..."></textarea></div>
    <div class="settings">
      <div class="field"><label>家族1</label><input id="name0"></div>
      <div class="field"><label>家族2</label><input id="name1"></div>
      <div class="field"><label>家族3</label><input id="name2"></div>
      <div class="field"><label>家族4</label><input id="name3"></div>
      <div class="field"><label>この端末の初期選択</label><select id="defaultMember"></select></div>
    </div>
    <div class="actions">
      <button class="btn" id="settingsCancel">閉じる</button>
      <button class="btn primary" id="settingsSave">保存して接続</button>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const COLORS = ["#2f6fed","#d93025","#188038","#f9ab00"];
const DEFAULT_NAMES = ["父","母","子1","子2"];
let members = JSON.parse(localStorage.getItem("family_names") || "null") || DEFAULT_NAMES;
let current = new Date();
current.setDate(1);
let events = [];
let sb = null;
let channel = null;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function loadSettingsUI(){
  const url = localStorage.getItem("supabase_url") || "";
  const key = localStorage.getItem("supabase_key") || "";
  $("supabaseUrl").value = url;
  $("supabaseKey").value = key;
  members.forEach((n,i)=> $("name"+i).value=n);
  rebuildMemberOptions();
  $("defaultMember").value = localStorage.getItem("default_member") || "0";
  $("setupBanner").classList.toggle("hidden", !!(url && key));
}

function rebuildMemberOptions(){
  $("member").innerHTML = members.map((n,i)=>`<option value="${i}">${escapeHtml(n)}</option>`).join("");
  $("defaultMember").innerHTML = members.map((n,i)=>`<option value="${i}">${escapeHtml(n)}</option>`).join("");
  $("legend").innerHTML = members.map((n,i)=>`<span><i class="dot" style="background:${COLORS[i]}"></i>${escapeHtml(n)}</span>`).join("");
}

function escapeHtml(v=""){
  return v.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}

async function connect(){
  const url = localStorage.getItem("supabase_url");
  const key = localStorage.getItem("supabase_key");
  if(!url || !key || !window.supabase) { render(); return; }
  try{
    if(channel && sb) await sb.removeChannel(channel);
    sb = window.supabase.createClient(url,key);
    await loadEvents();
    channel = sb.channel("family-events")
      .on("postgres_changes",{event:"*",schema:"public",table:"family_events"},()=>loadEvents())
      .subscribe();
  }catch(e){
    console.error(e);
    alert("Supabaseへの接続に失敗しました。設定を確認してください。");
  }
}

async function loadEvents(){
  if(!sb){ render(); return; }
  const first = new Date(current.getFullYear(), current.getMonth()-1, 20);
  const last = new Date(current.getFullYear(), current.getMonth()+2, 10);
  const {data,error} = await sb.from("family_events")
    .select("*").gte("event_date", ymd(first)).lte("event_date", ymd(last))
    .order("event_date").order("start_time",{ascending:true});
  if(error){ console.error(error); return; }
  events = data || [];
  render();
}

function render(){
  $("monthLabel").textContent = `${current.getFullYear()}年${current.getMonth()+1}月`;
  const cal = $("calendar"); cal.innerHTML="";
  const start = new Date(current.getFullYear(),current.getMonth(),1);
  start.setDate(start.getDate()-start.getDay());
  const today = ymd(new Date());

  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = ymd(d);
    const div=document.createElement("div");
    div.className="day";
    if(d.getMonth()!==current.getMonth()) div.classList.add("other");
    if(key===today) div.classList.add("today");
    div.dataset.date=key;
    div.innerHTML=`<div class="num">${d.getDate()}</div>`;
    const dayEvents = events.filter(e=>e.event_date===key);
    dayEvents.forEach(e=>{
      const ev=document.createElement("div");
      const idx=Math.max(0,Math.min(3,Number(e.member_index)||0));
      ev.className="event";
      ev.style.color=COLORS[idx];
      const time=e.start_time ? e.start_time.slice(0,5)+" " : "";
      ev.textContent=`${time}${members[idx] || "?"} ${e.title}`;
      ev.onclick=(x)=>{x.stopPropagation(); openEdit(e)};
      div.appendChild(ev);
    });
    div.onclick=()=>openNew(key);
    cal.appendChild(div);
  }
}

function openNew(date=ymd(new Date())){
  $("eventTitle").textContent="予定を登録";
  $("eventId").value="";
  $("eventDate").value=date;
  $("member").value=localStorage.getItem("default_member") || "0";
  $("startTime").value="";
  $("endTime").value="";
  $("category").value="仕事";
  $("title").value="";
  $("memo").value="";
  $("deleteBtn").classList.add("hidden");
  $("eventDialog").showModal();
}

function openEdit(e){
  $("eventTitle").textContent="予定を編集";
  $("eventId").value=e.id;
  $("eventDate").value=e.event_date;
  $("member").value=String(e.member_index);
  $("startTime").value=(e.start_time||"").slice(0,5);
  $("endTime").value=(e.end_time||"").slice(0,5);
  $("category").value=e.category||"その他";
  $("title").value=e.title||"";
  $("memo").value=e.memo||"";
  $("deleteBtn").classList.remove("hidden");
  $("eventDialog").showModal();
}

$("eventForm").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!sb){ alert("先に「設定」からSupabase接続を設定してください。"); return; }
  const payload={
    event_date:$("eventDate").value,
    member_index:Number($("member").value),
    start_time:$("startTime").value || null,
    end_time:$("endTime").value || null,
    category:$("category").value,
    title:$("title").value.trim(),
    memo:$("memo").value.trim()
  };
  const id=$("eventId").value;
  const q=id ? sb.from("family_events").update(payload).eq("id",id) : sb.from("family_events").insert(payload);
  const {error}=await q;
  if(error){ alert("保存に失敗しました: "+error.message); return; }
  $("eventDialog").close();
  await loadEvents();
});

$("deleteBtn").onclick=async()=>{
  const id=$("eventId").value;
  if(!id || !sb) return;
  if(!confirm("この予定を削除しますか？")) return;
  const {error}=await sb.from("family_events").delete().eq("id",id);
  if(error){ alert("削除に失敗しました: "+error.message); return; }
  $("eventDialog").close(); await loadEvents();
};
$("cancelBtn").onclick=()=>$("eventDialog").close();
$("prevBtn").onclick=()=>{current.setMonth(current.getMonth()-1);loadEvents()};
$("nextBtn").onclick=()=>{current.setMonth(current.getMonth()+1);loadEvents()};
$("todayBtn").onclick=()=>{current=new Date();current.setDate(1);loadEvents()};
$("addBtn").onclick=()=>openNew();
$("settingsBtn").onclick=()=>{loadSettingsUI();$("settingsDialog").showModal()};
$("settingsCancel").onclick=()=>$("settingsDialog").close();

$("settingsSave").onclick=async()=>{
  members=[0,1,2,3].map(i=>($("name"+i).value.trim()||DEFAULT_NAMES[i]));
  localStorage.setItem("family_names",JSON.stringify(members));
  localStorage.setItem("default_member",$("defaultMember").value);
  localStorage.setItem("supabase_url",$("supabaseUrl").value.trim());
  localStorage.setItem("supabase_key",$("supabaseKey").value.trim());
  rebuildMemberOptions();
  $("settingsDialog").close();
  loadSettingsUI();
  await connect();
};

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
}
loadSettingsUI();
render();
connect();
</script>
</body>
</html>
